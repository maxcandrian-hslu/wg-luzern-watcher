name: Keepalive

# Verhindert, dass GitHub den Zeitplan nach 60 Tagen Repo-Inaktivitaet pausiert.
# Macht 1x im Monat einen leeren Commit.

on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Leeren Commit erstellen
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: Zeitplan aktiv halten"
          git push
